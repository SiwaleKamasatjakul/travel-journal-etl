name: Run Job and ETL Pipeline

on:
  workflow_dispatch:                 # manual "Run workflow" button
    inputs:
      full_refresh:
        description: "Full-refresh the gold DLT tables (rebuild from scratch)"
        type: boolean
        default: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    env:
      DATABRICKS_HOST: ${{ secrets.DEPLOYMENT_TARGET_URL }}
      DATABRICKS_TOKEN: ${{ secrets.DEPLOYMENT_TARGET_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: databricks/setup-cli@main

      - name: Validate bundle
        run: databricks bundle validate -t prod

      - name: Deploy bundle
        run: databricks bundle deploy -t prod

      # ---------- run the medallion layers in order ----------
      - name: Run source ingestion
        run: databricks bundle run source_ingestion_job -t prod

      - name: Run bronze incremental
        run: databricks bundle run bronze_incremental_job -t prod

      - name: Run silver layer
        run: databricks bundle run silver_layer_job -t prod

      - name: Run gold dimension (Google Map Address)
        run: databricks bundle run gold_google_map_address_job -t prod

      - name: Run gold layer (DLT)
        run: |
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            echo "Running gold with FULL REFRESH"
            databricks bundle run gold_dlt_pipeline -t prod --full-refresh-all
          else
            echo "Running gold incrementally"
            databricks bundle run gold_dlt_pipeline -t prod
          fi