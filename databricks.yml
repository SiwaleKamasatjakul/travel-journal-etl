bundle:
  name: travel-journal-etl

targets:
  prod:
    mode: production
    default: true
    workspace:
      host: https://adb-7405608552083635.15.azuredatabricks.net          
      root_path: /Workspace/Users/siwale.kama@outlook.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: siwale.kama@outlook.com



resources:
  jobs:

    # ============ JOB 1: Source Ingestion ============
    source_ingestion_job:
      name: source-ingestion-${bundle.target}
      tasks:
        - task_key: ingest
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: "./source_ingestion/Source Ingestion.ipynb"

    # ============ JOB 2: Bronze Incremental ============
    bronze_incremental_job:
      name: bronze-incremental-${bundle.target}
      tasks:
        - task_key: bronze_incremental
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: "./bronze_incremental/Bronze Incremental.ipynb"

    # ============ JOB 3: Silver Layer ============
    silver_layer_job:
      name: silver-layer-${bundle.target}
      tasks:
        - task_key: silver_google_map_address
          max_retries: 2
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: "./silver_layer/Silver Google map address.ipynb"

        - task_key: silver_image
          notebook_task:
            notebook_path: "./silver_layer/Silver image.ipynb"

        - task_key: silver_activity_tag
          notebook_task:
            notebook_path: "./silver_layer/Silver Layer Activity Tag.ipynb"

        - task_key: silver_country_code
          notebook_task:
            notebook_path: "./silver_layer/Silver Layer Country Code.ipynb"

        - task_key: silver_follows
          notebook_task:
            notebook_path: "./silver_layer/Silver Layer Follows.ipynb"

        - task_key: silver_location_country_tag
          notebook_task:
            notebook_path: "./silver_layer/Silver Layer Location Country tag.ipynb"

        - task_key: silver_post_bookmarks
          notebook_task:
            notebook_path: "./silver_layer/Silver Post Bookmarks.ipynb"

        - task_key: silver_post_like
          notebook_task:
            notebook_path: "./silver_layer/Silver Post Like.ipynb"

        - task_key: silver_trip_stop
          notebook_task:
            notebook_path: "./silver_layer/Silver Trip Stop.ipynb"

        - task_key: silver_layer_account
          notebook_task:
            notebook_path: "./silver_layer/Silver_Layer_Accounts.ipynb"

        - task_key: silver_activity_code
          notebook_task:
            notebook_path: "./silver_layer/Silver_Layer_Activity_Code.ipynb"

        - task_key: silver_bio
          notebook_task:
            notebook_path: "./silver_layer/Silver_Layer_Bio.ipynb"

  pipelines:
    gold_dlt_pipeline:
      name: gold-dlt-${bundle.target}
      serverless: true
      catalog: main                    # omit if you're not using Unity Catalog
      target: gold
      libraries:
        - notebook:
            path: "./gold_layer/Gold Activity Code.ipynb"
        - notebook:
            path: "./gold_layer/Gold Country Code.ipynb"
        - notebook:
            path: "./gold_layer/Gold Dim Date.ipynb"
        - notebook:
            path: "./gold_layer/Gold Fact Post Likes and Bookmark.ipynb"
        - notebook:
            path: "./gold_layer/Gold Follow.ipynb"
        - notebook:
            path: "./gold_layer/Gold Google Map Address.ipynb"
        - notebook:
            path: "./gold_layer/Gold Layer Dim User.ipynb"
        - notebook:
            path: "./gold_layer/Gold Trip Post.ipynb"
        - notebook:
            path: "./gold_layer/Gold Trip Stop.ipynb"








