bundle:
  name: travel-journal-etl

targets:
  prod:
    mode: production
    default: true
    workspace:
      host: https://adb-7405608552083635.15.azuredatabricks.net           # <-- FILL IN
      root_path: /Workspace/Users/siwale.kama@outlook.com/.bundle/${bundle.name}/${bundle.target}   # <-- FILL IN (token's identity)
    run_as:
      user_name: siwale.kama@outlook.com                           # <-- same email

resources:
  jobs:

    # ============ JOB 1: Source Ingestion ============
    source_ingestion_job:
      name: source-ingestion-${bundle.target}
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: "./source_ingestion/Source Ingestion.ipynb"
          job_cluster_key: shared_cluster
          max_retries: 2
          min_retry_interval_millis: 60000
      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
            data_security_mode: SINGLE_USER


    # ============ JOB 2: Bronze Incremental (2 tasks, passes a value) ============
    bronze_incremental_job:
      name: bronze-incremental-${bundle.target}
      tasks:
        # Task 1 — SENDER: sets the task value
        - task_key: parameter_task
          notebook_task:
            notebook_path: "./bronze_incremental/Travel_Journal_Column_Parameter.ipynb"
          job_cluster_key: shared_cluster

        # Task 2 — RECEIVER: gets the value via the "table" widget
        - task_key: bronze_incremental_task
          depends_on:
            - task_key: parameter_task
          notebook_task:
            notebook_path: "./bronze_incremental/Bronze Incremental.ipynb"
            base_parameters:
              table: "{{tasks.parameter_task.values.travel_journal_table}}"
          job_cluster_key: shared_cluster
          max_retries: 2
          min_retry_interval_millis: 60000

      job_clusters:
        - job_cluster_key: shared_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2
            data_security_mode: SINGLE_USER
